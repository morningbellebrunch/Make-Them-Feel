:root{
  --green:#99C961;--yellow:#ffde5c;--coral:#fc826d;--teal:#3c5c68;--amber:#fbaf41;--sage:#9bc4bc;--dark:#22343b;
  --bg:#f7faf6;--surface:#fff;--surface-2:#eef4ee;--ink:#22343b;--soft:#5d6a6e;--line:#dbe6dd;--soil:#c9b9a3;--head:#3c5c68;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#132027;--surface:#1c2d34;--surface-2:#24383f;--ink:#eef3f1;--soft:#a3b5b5;--line:#2f444b;--soil:#6d5f4f;--head:#cfe6c0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#132027;--surface:#1c2d34;--surface-2:#24383f;--ink:#eef3f1;--soft:#a3b5b5;--line:#2f444b;--soil:#6d5f4f;--head:#cfe6c0;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
.d{font-family:Anton,"Oswald","Impact","Arial Narrow Bold",sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.005em}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}
header.top{display:flex;align-items:center;gap:10px;padding:14px 0}
header.top img{width:22px;height:28px;display:block}
header.top span{font-size:20px;color:var(--head)}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* quote blocks */
.q{line-height:.98;margin:0}
.q .w{color:var(--qi)}
.q .em{color:var(--qe);font-size:1.9em;display:inline-block;line-height:.92}
.q cite{display:block;font-style:normal;font-family:"DM Sans",system-ui,sans-serif;font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--qi);margin-top:14px;opacity:.9}

/* open */
.open{background:var(--coral);--qi:var(--dark);--qe:#fff;border-radius:28px;padding:30px 22px 26px;margin-top:4px}
.open .q{font-size:clamp(34px,10.5vw,60px)}
.open .q .big{color:#fff;font-size:2.35em;display:block;line-height:.9}
.form{padding:26px 0 10px}
.form .lede{font-size:21px;font-weight:700;line-height:1.3;margin:0 0 22px}
.field{margin-bottom:18px}
.field label{display:block;font-weight:700;font-size:15px;margin-bottom:8px;color:var(--head)}
.field input{width:100%;font:inherit;font-size:20px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.seg button{padding:13px 4px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-weight:500;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--head);border-color:var(--head);color:var(--bg)}
.go{width:100%;margin-top:8px;padding:16px;border:0;border-radius:16px;background:var(--dark);color:#fff;font-size:30px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .go{background:var(--coral);color:var(--dark)}}

/* me */
.me h1{font-size:clamp(40px,11vw,64px);line-height:.95;margin:6px 0 0;color:var(--head)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 12px 10px}
.stat b{display:block;font-size:36px;line-height:1;color:var(--head);font-weight:400}
.stat span{font-size:13px;color:var(--soft)}
.next{font-size:14px;color:var(--soft);margin:10px 2px 0}
.garden{margin:14px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px 10px 8px}
.plots{display:grid;grid-template-columns:repeat(10,1fr);position:relative}
.plots::after{content:"";position:absolute;left:4px;right:4px;bottom:27px;height:3px;border-radius:3px;background:var(--soil)}
.plot{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--soft);font-size:12px;position:relative;z-index:1;border-radius:10px}
.plot svg{width:100%;max-width:44px;height:50px;overflow:visible}
.plot .leaf{transform-origin:30px 46px;transition:transform .55s cubic-bezier(.3,1.5,.5,1)}
.plot:not(.done) .leaf{transform:scale(0)}
.plot .seed{fill:var(--soil)}
.plot.done .seed{opacity:0}
.plot .ring{opacity:0;fill:none;stroke:var(--coral);stroke-width:2;stroke-dasharray:3 3}
.plot.current{color:var(--ink);font-weight:700}
.plot.current .ring{opacity:1}

/* day */
.day{margin:22px 0 0;border-radius:28px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.panel{background:var(--pbg);--qi:var(--pi);--qe:var(--pe);color:var(--pi);padding:22px 22px 26px}
.panel .n{font-weight:700;font-size:15px}
.panel .feel{font-size:22px;margin:14px 0 0;line-height:1}
.word{color:var(--pe);line-height:.86;margin:4px 0 22px;white-space:nowrap}
.panel .q{font-size:clamp(24px,6.6vw,36px);border-top:3px solid var(--pi);padding-top:18px}
.body{padding:20px 20px 22px;display:grid;gap:14px}
.k{font-weight:700;font-size:14px;color:var(--soft);margin:0 0 4px}
.move p:not(.k){margin:0;font-size:21px;line-height:1.3;font-weight:700}
.team-toggle{border:0;background:none;padding:10px 0 0;color:var(--head);font-weight:700;font-size:15px;text-decoration:underline;text-underline-offset:3px}
.team{display:grid;gap:8px;margin-top:10px}
.mate{border-left:4px solid var(--green);background:var(--surface-2);border-radius:0 14px 14px 0;padding:10px 14px}
.mate p:not(.k){margin:0;font-size:17px;font-weight:500;line-height:1.35}
.mission{background:var(--surface-2);border-radius:20px;padding:16px}
.mission .task{font-size:28px;line-height:1.05;margin:0 0 14px;color:var(--head)}
.counter{display:flex;align-items:center;gap:14px}
.plus{flex:0 0 auto;width:78px;height:78px;border-radius:50%;border:0;background:var(--green);color:var(--dark);font-size:30px}
.plus:active{transform:scale(.94)}
.tally b{font-size:48px;line-height:1;color:var(--head);font-weight:400}
.tally span{color:var(--soft);font-size:16px}
.undo{margin-left:auto;border:0;background:none;color:var(--soft);text-decoration:underline;text-underline-offset:3px;font-size:14px;padding:8px}
.bar{height:8px;border-radius:8px;background:var(--line);margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:8px;transition:width .35s}
.dare{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface-2);border:0;border-radius:20px;padding:16px;color:var(--ink)}
.box{flex:0 0 30px;height:30px;border-radius:9px;border:2px solid var(--soft);display:grid;place-items:center;font-weight:700;color:var(--dark)}
.dare[aria-pressed="true"] .box{background:var(--green);border-color:var(--green)}
.dare .t{display:block;font-size:19px;font-weight:700;line-height:1.3}
.moment input{width:100%;font:inherit;font-size:17px;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.plant{width:100%;padding:16px;border:0;border-radius:16px;font-size:26px;background:var(--head);color:var(--bg)}
.plant[disabled]{opacity:.35;cursor:default;font-family:"DM Sans",system-ui,sans-serif;text-transform:none;font-size:16px;font-weight:700}
.plant.planted{background:transparent;color:var(--head);border:2px solid var(--green)}
.nav{display:flex;gap:10px}
.nav button{flex:1;padding:13px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-weight:500}
.nav button[disabled]{opacity:.35;cursor:default}

/* finale + moments */
.finale{margin:22px 0 0}
.moments{margin:28px 0 0}
.moments h2{font-size:34px;color:var(--head);margin:0 0 12px;font-weight:400}
.moments ol{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.moments li{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:baseline}
.moments li b{color:var(--head);min-width:6.2em;font-size:18px;font-weight:400}
footer{padding:30px 0 44px;color:var(--soft);font-size:14px}
footer p{margin:0 0 8px}
footer button{border:0;background:none;color:var(--soft);text-decoration:underline;text-underline-offset:3px;padding:0;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,calc(100% + 60px));background:var(--dark);color:#fff;padding:14px 22px;border-radius:16px;font-size:22px;transition:transform .35s;z-index:20;max-width:90vw;text-align:center}
.toast.show{transform:translate(-50%,0)}

.payoff{margin:26px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:22px 18px 18px}
.payoff .hon{margin:0 0 10px;font-weight:700;color:var(--soft);font-size:15px}
.payoff .num{font-size:clamp(96px,30vw,160px);line-height:.85;color:var(--coral)}
.payoff .numl{font-size:clamp(24px,6.5vw,34px);line-height:1;color:var(--head);margin:18px 0 14px}
.payoff .garden{margin:0 0 14px}
.mlist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.mlist li{background:var(--surface-2);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:baseline}
.mlist li b{color:var(--head);min-width:6.2em;font-size:18px;font-weight:400}
.hint{margin:0;color:var(--soft);font-size:15px}
.opener{background:#22343b;--qi:#e8f0ec}
.opener .q{font-size:clamp(34px,10vw,58px)}
.opener .bw{display:block;color:#b9c4c2;line-height:.95}
.opener .hi{display:block;color:#fff;margin-top:14px;line-height:1}
.opener .color{display:block;font-size:2.9em;line-height:.88;letter-spacing:-.01em}
.opener .color i{font-style:normal}
.opener cite{color:#e8f0ec}
.opener{padding:0 !important;overflow:hidden;background:#1d1d1f !important}
.opimg{margin:0}
.opimg img{display:block;width:100%;height:auto}
.opimg figcaption{color:#e8f0ec;font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.06em;padding:14px 22px 18px;text-align:center}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;border:0;border-radius:999px;background:var(--coral);color:var(--dark);font-size:21px;padding:13px 20px;box-shadow:0 6px 18px rgba(34,52,59,.28)}
footer{padding-bottom:110px !important}
.ways{padding:4px 0 10px}
.wh{font-size:clamp(44px,12vw,76px);line-height:.92;color:var(--head);margin:6px 0 12px;font-weight:400}
.wsub{margin:0 0 18px;color:var(--soft)}
.wsub b{color:var(--ink)}
.picked{display:flex;gap:16px;align-items:center;background:var(--coral);color:var(--dark);border-radius:22px;padding:18px 20px;margin:14px 0 0}
.picked span{font-size:64px;line-height:.9}
.picked p{margin:0;font-size:22px;font-weight:700;line-height:1.25}
.chips{display:flex;gap:8px;overflow-x:auto;padding:16px 0 4px;scrollbar-width:none}
.chip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:9px 14px;font-weight:500;font-size:15px}
.chip[aria-pressed="true"]{background:var(--head);border-color:var(--head);color:var(--bg)}
.wtools{display:flex;gap:8px;margin:8px 0 14px}
.wtools input{flex:1;min-width:0;font:inherit;font-size:16px;padding:10px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.wl{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.way{width:100%;display:flex;gap:14px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;color:var(--ink)}
.way .wn{flex:0 0 1.55em;font-size:30px;text-align:center;line-height:1;color:var(--coral)}
.way .wt{flex:1;font-size:17px;font-weight:700;line-height:1.3}
.way .wt small{display:block;font-weight:400;font-size:13px;color:var(--soft);margin-top:3px}
.way.done{background:var(--surface-2)}
.way.done .wn{color:var(--green)}
.way.done .wt{opacity:.7}
.empty{color:var(--soft);padding:14px}
@media (prefers-reduced-motion:reduce){.plot .leaf,.bar i,.toast{transition:none}}
</style>
</head>

 {w:"Heard",f:"heard",bg:"#4d4d4d",pi:"#e8ecea",pe:"#ffde5c",

const WAYS=[
[0,"HSM","Hold the door. Coming in and going out."],
[0,"H","Greet every guest before they reach the stand."],
[0,"A","Smile with your eyes, not just your mouth."],
[0,"HSM","Look up every time the door opens."],

[0,"H","Walk guests to their table. Never point."],
[0,"HS","Pull out a chair for the guest who needs a hand."],
[0,"H","Offer to take the coat on a cold Michigan morning."],
[0,"HS","Welcome the kids too, not just the parents."],
[0,"A","Say good morning to every Gardener who walks in."],
[0,"B","Wave to the dining room from the line. A kitchen that smiles gets felt."],
[1,"A","Notice the balloon, the new ring, the cast on the arm."],
[1,"A","Learn one regular’s name every shift."],

[1,"A","Give a compliment that’s real. Never generic."],
[1,"B","Read the allergy flag twice. Someone is trusting you."],
[1,"A","Notice a teammate having a rough day. Say something."],
[1,"SM","Tell the cook their plate looked perfect."],
[1,"M","Name the Gardener who went above and beyond at huddle."],
[2,"HS","Ask what brings them in today. Then actually listen."],
[2,"H","Seat the occasion, not the next open table."],
[2,"HS","Give the work meeting quiet and speed."],
[2,"S","Give the reunion time. Never rush a story."],
[2,"S","Ask how they like it instead of assuming."],
[2,"S","Repeat the mod back so they know you got it."],
[2,"B","Cook every mod like it’s their favorite meal. It is."],
[2,"S","Ask the parents what the kids need first."],
[2,"S","Offer the quick option to the guest watching the clock."],
[2,"A","Ask a teammate how they like to be helped."],
[2,"M","Ask your team what’s in their way. Then remove it."],
[3,"SM","Top off coffee before the mug runs low."],
[3,"S","Bring extra napkins with the french toast before they ask."],
[3,"H","High chair and crayons waiting before the family sits."],
[3,"S","Bring the box when the fork slows down."],
[3,"HM","Walk an umbrella out on a rainy day."],
[3,"H","Offer a seat to the guest waiting on their feet."],
[3,"H","Quote honest wait times. Then beat them."],

[5,"SB","Candle on the birthday stack. Sing if they want it."],

[5,"S","Let a kid be the hero. Ask them to order for the table."],

[6,"A","Ask for help before you need it."],
[6,"A","Learn every new Gardener’s name on their first day."],

[6,"A","Say thank you for the small stuff."],

[8,"A","Say “I’ve got it” and mean it."],
[8,"H","Keep the stand clean and the list in order."],
[8,"M","Walk the floor, not the office, during the rush."],
[8,"M","Bring calm to the weeds. Your energy is contagious."],
[9,"HSM","Hold the door on the way out. The last impression lasts longest."],
[9,"HSM","Say goodbye by name."],
[9,"HSM","Thank them for choosing Morning Belle."],
[9,"S","Invite them back for something specific to try next time."],
[9,"A","Remember them next time. Let them know you did."],
[9,"SM","Tell the next shift about a regular so the whole team knows them."],
[9,"A","Find your signature move. Give it to every guest."],
[9,"B","Leave your station better than you found it."],
[9,"M","Leave every Gardener better than you found them."],

const RL={H:"Host",S:"Server",B:"BOH",M:"Manager"};
const RID={host:"H",server:"S",boh:"B",manager:"M"};
let view=location.hash==="#ways"?"ways":"program",wf=-2,wmine=false,wq="",wpick=-1;
const KEY="mb-make-them-feel-v1";
const blank=()=>({name:"",role:"server",days:D.map(()=>({c:0,dare:false,moment:"",planted:false}))});
let S;try{S=JSON.parse(localStorage.getItem(KEY))||blank()}catch(e){S=blank()}
if(!S.days||S.days.length!==10)S=blank();
if(!Array.isArray(S.ways))S.ways=[];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const qhtml=(q,by)=>'<blockquote class="q d">“'+esc(q).replace(/\*(.+?)\*/g,'<span class="em">$1</span>').replace(/^“([^<]+)/,'“<span class="w">$1</span>')+'”'+(by?'<cite>'+esc(by)+'</cite>':'')+'</blockquote>';
let cur=(()=>{const m=location.hash.match(/^#day-(\d+)$/);if(m&&+m[1]>=1&&+m[1]<=10)return +m[1];const i=S.days.findIndex(d=>!d.planted);return i<0?10:i+1})();
const app=document.getElementById("app");
let showAll=false;
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("show"),2600)}
const guests=()=>S.days.reduce((a,d,i)=>a+(D[i].team?0:d.c),0);
const mates=()=>S.days.reduce((a,d,i)=>a+(d.dare?1:0)+(D[i].team?d.c:0),0);
const rank=()=>{const t=guests()+mates();let r=RANKS[0];for(const x of RANKS)if(t>=x[0])r=x;return{r:r[1],nx:RANKS.find(x=>x[0]>t),t}};
function fit(){const w=document.querySelector(".word");if(!w)return;const cs=getComputedStyle(w.parentElement);const box=w.parentElement.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);w.style.fontSize="200px";const s=Math.min(200,200*box/w.scrollWidth*0.98);w.style.fontSize=s+"px"}

function onboard(){
  app.innerHTML=`<section class="open opener">${OPEN}</section>
  <section class="form">
    <p class="lede">Ten days. Ten feelings. Every guest. Every teammate. Every shift.</p>
    <div class="field"><label for="nm">Your first name</label><input id="nm" autocomplete="given-name" value="${esc(S.name)}"></div>
    <div class="field"><label id="rl">Your role</label><div class="seg" role="group" aria-labelledby="rl">${ROLES.map(([id,n])=>`<button type="button" data-r="${id}" aria-pressed="${S.role===id}">${n}</button>`).join("")}</div></div>
    <button class="go d" id="go">I care</button>
  </section>`;
  app.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{S.role=b.dataset.r;app.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed",x===b))});
  document.getElementById("go").onclick=()=>{const v=document.getElementById("nm").value.trim();if(!v){document.getElementById("nm").focus();return}S.name=v;save();render()};
}
const plots=()=>D.map((d,i)=>{const n=i+1,p=S.days[i].planted;return `<button class="plot${p?" done":""}${n===cur?" current":""}" data-d="${n}" aria-label="Day ${n}, ${d.w}${p?", planted":""}"><svg viewBox="0 0 44 50" aria-hidden="true"><circle class="ring" cx="22" cy="28" r="19"/><ellipse class="seed" cx="22" cy="44" rx="5" ry="3.5"/><use class="leaf" href="#bug"/></svg><span>${n}</span></button>`}).join("");


function renderWays(){
  const rc=RID[S.role]||"S";
  const list=WAYS.map((w,i)=>({w,i})).filter(({w})=>(wf===-2||w[0]===wf)&&(!wmine||w[1]==="A"||w[1].includes(rc))&&(!wq||w[2].toLowerCase().includes(wq.toLowerCase())));
  const chips=[[-2,"All 111"],...D.map((d,i)=>[i,d.w])];
  app.innerHTML=`<section class="ways">
    <h1 class="d wh">111 ways to make them feel something</h1>
    <p class="wsub">Guests and teammates. After your shift, check off the ways you did. <b>${S.ways.length} of 111</b> done${S.name?`, ${esc(S.name)}`:""}.</p>
    <button class="go d" id="pick">Give me one</button>
    ${wpick>=0?`<div class="picked"><span class="d">${wpick+1}</span><p>${WAYS[wpick][2]}</p></div>`:""}
    <div class="chips" role="group" aria-label="Filter by feeling">${chips.map(([v,l])=>`<button class="chip" data-f="${v}" aria-pressed="${wf===v}">${l}</button>`).join("")}</div>
    <div class="wtools">
      <input id="wq" type="search" placeholder="Search the 111" value="${esc(wq)}" aria-label="Search the 111">
      <button class="chip" id="mine" aria-pressed="${wmine}">${RL[rc]} only</button>
    </div>
    <ol class="wl">${list.map(({w,i})=>{const done=S.ways.includes(i);return `<li><button class="way${done?" done":""}" data-i="${i}" aria-pressed="${done}"><span class="wn d">${i+1}</span><span class="wt">${w[2]}<small>${w[0]<0?"Everything":D[w[0]].w}${w[1]==="A"?"":" · "+w[1].split("").map(c=>RL[c]).join(", ")}</small></span><span class="box">${done?"✓":""}</span></button></li>`}).join("")||'<li class="empty">Nothing matches. Clear the search or pick another feeling.</li>'}</ol>
  </section>`;
  app.querySelectorAll(".chips .chip").forEach(b=>b.onclick=()=>{wf=+b.dataset.f;wpick=-1;renderWays()});
  document.getElementById("mine").onclick=()=>{wmine=!wmine;renderWays()};
  const q=document.getElementById("wq");q.oninput=e=>{wq=e.target.value;const p=q.selectionStart;renderWays();const n=document.getElementById("wq");n.focus();n.setSelectionRange(p,p)};
  document.getElementById("pick").onclick=()=>{const pool=list.filter(x=>!S.ways.includes(x.i));const src=pool.length?pool:list;if(!src.length)return;wpick=src[Math.floor(Math.random()*src.length)].i;renderWays();document.querySelector(".picked").scrollIntoView({block:"nearest"})};
  app.querySelectorAll(".way").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(S.ways.includes(i))S.ways=S.ways.filter(x=>x!==i);else{S.ways.push(i);if(S.ways.length%10===0)toast(S.ways.length+" ways. Keep going.")}save();renderWays()});
}
function setView(v){view=v;try{history.replaceState(null,"",v==="ways"?"#ways":"#day-"+cur)}catch(e){}document.getElementById("fab").textContent=v==="ways"?"My 10 days":"111 ways";render();scrollTo(0,0)}
function render(){
  if(view==="ways")return renderWays();
  if(!S.name)return onboard();
  const d=D[cur-1],st=S.days[cur-1],role=ROLES.find(r=>r[0]===S.role),ready=st.c>=d.n&&st.dare;
  const all=S.days.every(x=>x.planted);
  const moments=S.days.map((x,i)=>x.moment?`<li><b class="d">${D[i].w}</b><span>${esc(x.moment)}</span></li>`:"").join("");
  const task=d.team?`Make ${d.n} teammates feel ${d.f}.`:`Make ${d.n} ${d.n===1?"guest":"guests"} feel ${d.f}.`;
  app.innerHTML=`
  ${all?`<section class="open finale">${LEAD}</section>`:""}
  <article class="day">
    <div class="panel" style="--pbg:${d.bg};--pi:${d.pi};--pe:${d.pe}">
      <div class="n">Day ${cur}</div>
      <p class="feel d">Today they leave feeling</p>
      <div class="word d">${d.w}.</div>
      ${qhtml(d.q,d.by)}
    </div>
    <div class="body">
      <div class="move"><p class="k">You, as ${role[1]}</p><p>${d[S.role]}</p>
        <button class="team-toggle" id="tt" aria-expanded="${showAll}">${showAll?"Hide the team":"See what every teammate does today"}</button>
        ${showAll?`<div class="team">${ROLES.filter(r=>r[0]!==S.role).map(r=>`<div class="mate"><p class="k">${r[1]}</p><p>${d[r[0]]}</p></div>`).join("")}</div>`:""}
      </div>
      <div class="mission">
        <p class="k">Today’s mission. Log it after your shift.</p>
        <p class="task d">${task}</p>
        <div class="counter">
          <button class="plus d" id="plus" aria-label="Add one">+1</button>
          <div class="tally"><b class="d">${st.c}</b> <span>of ${d.n}</span></div>
          ${st.c>0?'<button class="undo" id="undo">Undo</button>':""}
        </div>
        <div class="bar"><i style="width:${Math.min(100,st.c/d.n*100)}%"></i></div>
      </div>
      <button class="dare" id="dare" aria-pressed="${st.dare}"><span class="box">${st.dare?"✓":""}</span><span><span class="k" style="display:block">Make a teammate feel ${d.f}</span><span class="t">${d.dare}</span></span></button>
      <div class="moment"><label class="k" for="mo">${cur===10?"What I want to be remembered for":"The moment I’ll remember"}</label><input id="mo" maxlength="140" value="${esc(st.moment)}" placeholder="${cur===10?"The one thing every guest gets from me":"Who it was for, and what you did"}"></div>
      <button class="plant${st.planted?" planted":""}${(ready||st.planted)?" d":""}" id="plant" ${!ready&&!st.planted?"disabled":""}>${st.planted?`${d.w}. Planted.`:ready?`Plant ${d.w}`:"After your shift, log the mission and the teammate dare to plant"}</button>
      <button class="team-toggle" id="more">11 more ways to make them feel ${d.f}</button>
      <div class="nav"><button id="prev" ${cur===1?"disabled":""}>Previous</button><button id="next" ${cur===10?"disabled":""}>Next</button></div>
    </div>
  </article>
  <section class="payoff">
    <p class="hon">For the Gardener who does the small thing nobody asked for.</p>
    <div class="num d">${guests()+mates()}</div>
    <p class="numl d">${esc(S.name)}, the people you made feel something</p>
    <div class="garden"><div class="plots">${plots()}</div></div>
    ${moments?`<ol class="mlist">${moments}</ol>`:'<p class="hint">Every moment you write down lands here.</p>'}
  </section>`;
  fit();
  document.getElementById("tt").onclick=()=>{showAll=!showAll;render()};
  document.getElementById("more").onclick=()=>{wf=cur-1;wpick=-1;setView("ways")};
  app.querySelectorAll(".plot").forEach(b=>b.onclick=()=>go(+b.dataset.d));
  document.getElementById("plus").onclick=()=>{st.c++;save();if(st.c===d.n)toast(st.dare?"Done. Plant it.":"Mission done. Now a teammate.");render()};
  const u=document.getElementById("undo");if(u)u.onclick=()=>{st.c=Math.max(0,st.c-1);save();render()};
  document.getElementById("dare").onclick=()=>{st.dare=!st.dare;save();render()};
  document.getElementById("mo").onchange=e=>{st.moment=e.target.value.trim();save();render()};
  document.getElementById("plant").onclick=()=>{if(st.planted||!ready)return;st.planted=true;save();const left=S.days.filter(x=>!x.planted).length;toast(left?`${d.w}. Planted. ${left} to go.`:`All ten. They know you care.`);render()};
  document.getElementById("prev").onclick=()=>go(cur-1);
  document.getElementById("next").onclick=()=>go(cur+1);
}
function go(n,h){if(n<1||n>10)return;cur=n;showAll=false;if(!h){try{history.replaceState(null,"","#day-"+n)}catch(e){}}render();if(!h)document.querySelector(".day").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"})}
addEventListener("hashchange",()=>{if(location.hash==="#ways"){if(view!=="ways")setView("ways");return}const m=location.hash.match(/^#day-(\d+)$/);if(m){view="program";document.getElementById("fab").textContent="111 ways";go(+m[1],true)}});
document.getElementById("fab").onclick=()=>setView(view==="ways"?"program":"ways");
addEventListener("resize",fit);
if(document.fonts)document.fonts.ready.then(fit);
document.getElementById("reset").onclick=()=>{if(confirm("Start over? Your garden, moments, and 111 ways will be cleared.")){S=blank();S.ways=[];save();cur=1;view="program";document.getElementById("fab").textContent="111 ways";render()}};
if(view==="ways")document.getElementById("fab").textContent="My 10 days";
render();
</script>
</body>
</html>
